<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>Algo salió mal — Sunqu Journeys</title>
		<link rel="icon" href="/assets/favicon-32.png" type="image/png">
		<style>
			@font-face{font-family:Aeonik;src:url(/fonts/Aeonik-Regular.woff2) format("woff2"),url(/fonts/Aeonik-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
			@font-face{font-family:Aeonik;src:url(/fonts/Aeonik-Bold.woff2) format("woff2"),url(/fonts/Aeonik-Bold.ttf) format("truetype");font-weight:600 800;font-display:swap}
			*{box-sizing:border-box}
			body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1c1c;color:#e9eef1;font-family:Aeonik,system-ui,sans-serif;padding:32px 20px}
			main{max-width:560px;text-align:left}
			img{display:block;height:40px;width:auto}
			h1{margin:40px 0 0;font-size:clamp(34px,7vw,56px);line-height:1.04;letter-spacing:-.03em;font-weight:600}
			p{margin:16px 0 0;font-size:18px;line-height:1.55;color:rgba(233,238,241,.8)}
			nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
			a.btn{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;font-weight:500}
			.p{background:#83b300;color:#1c1c1c}
			a:focus-visible{outline:2px solid #f4a700;outline-offset:3px}
		</style>
	</head>
	<body>
		<main>
			<a href="/" aria-label="Sunqu Journeys, inicio"><img src="/assets/logo-light.png" alt="Sunqu"></a>
			<h1>Algo salió mal de nuestro lado.</h1>
			<p>No pudimos mostrar esta página. Vuelve a intentarlo en unos minutos.</p>
			<nav aria-label="Enlaces de ayuda">
				<a class="btn p" href="/">Ir al inicio</a>
			</nav>
		</main>
	</body>
</html>
