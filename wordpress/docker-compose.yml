# Entorno local de Sunqu: WordPress (CMS) + base de datos + WP-CLI + la web como en producción.
#
#   ./setup.sh                      instala todo, importa content/*.json y verifica
#   http://localhost:8080/wp-admin  panel de WordPress (usuario y clave en .env)
#   http://localhost:8081           la web con Apache + PHP + .htaccess (igual que Hostinger), leyendo WordPress
#   http://localhost:8025           Mailpit: los correos de los formularios (en local no salen a Internet)
#   docker compose run --rm cli …   cualquier comando de WP-CLI (p. ej. «sunqu exportar --dir=/var/www/front/content»)
name: sunqu

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-sunqu}
  WORDPRESS_DB_USER: ${DB_USER:-sunqu}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-sunqu}

x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - ./sunqu-cms:/var/www/html/wp-content/plugins/sunqu-cms
  - ./sunqu-headless:/var/www/html/wp-content/themes/sunqu-headless
  - ..:/var/www/front          # la web: content/*.json y assets/ para importar

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sunqu}
      MARIADB_USER: ${DB_USER:-sunqu}
      MARIADB_PASSWORD: ${DB_PASSWORD:-sunqu}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sunqu-root}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"   # solo este equipo (las claves locales son de ejemplo)
    environment:
      <<: *db-env
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        // Dentro de Docker la web se llama «sitio» (en producción se usa Sunqu › Conexión › URL de la web)
        define('SUNQU_PURGA_URL', 'http://sitio/_sunqu/purge');
        // Correos de los formularios → Mailpit (http://localhost:8025). En producción: el buzón SMTP del dominio.
        define('SUNQU_SMTP_HOST', 'mailpit');
        define('SUNQU_SMTP_PORT', 1025);
        define('SUNQU_SMTP_SECURE', '');
        define('SUNQU_MAIL_FROM', 'avisos@sunqu.test');
    volumes: *wp-volumes

  # Atrapa los correos que envía WordPress para verlos en el navegador (no los entrega a nadie)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"               # mismo usuario que el contenedor de WordPress (www-data)
    depends_on:
      - wordpress
    environment:
      <<: *db-env
      HOME: /tmp
    volumes: *wp-volumes
    entrypoint: ["wp"]

  # La web tal como corre en Hostinger: Apache + PHP 8.3 + .htaccess + server/index.php.
  # Usa la imagen de WordPress solo por su Apache y PHP (el entrypoint propio evita que instale WordPress).
  sitio:
    image: wordpress:6-php8.3-apache
    depends_on:
      - wordpress
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    entrypoint: ["bash", "-c", "chown www-data: /var/www/html/server/storage && a2enmod -q headers && exec apache2-foreground"]
    environment:
      # Las mismas variables que el .env de producción (ver .env.example en la raíz)
      APP_ENV: production
      SITE_URL: ${WEB_URL:-http://localhost:8081}
      WORDPRESS_API_URL: ${WP_URL:-http://localhost:8080}/wp-json
      WORDPRESS_API_URL_INTERNAL: http://wordpress/wp-json
      CONTENT_CACHE_TTL: "300"
      CACHE_PURGE_TOKEN: ${PURGE_TOKEN:-}
      GA4_ID: ${GA4_ID:-}
      GTM_ID: ${GTM_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      CONSENT_MODE: ${CONSENT_MODE:-banner}
      CSP_MODE: enforce
    volumes:
      - ..:/var/www/html
      - sitio-cache:/var/www/html/server/storage   # caché de contenido fuera del repositorio

volumes:
  db:
  wp:
  sitio-cache:
